name: ci

on:
  push:
    branches: [develop, "feature/**"]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  NODE_VERSION: "20"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      # GitHub Environments (must match what you created in repo settings)
      deploy_env: ${{ steps.out.outputs.deploy_env }}

      # Angular build configuration
      ng_config: ${{ steps.out.outputs.ng_config }}

    steps:
      - uses: actions/checkout@v4

      - id: out
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
            echo "ng_config=production" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
            echo "ng_config=development" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (optional)
        run: npm test --if-present

      - name: Build (web)
        run: npx ng build web --configuration ${{ needs.meta.outputs.ng_config }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/**

  deploy:
    runs-on: ubuntu-latest
    needs: [meta, build]

    # IMPORTANT: this must match your GitHub Environment name: dev / prod
    environment: ${{ needs.meta.outputs.deploy_env }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        shell: bash
        run: |
          set -euo pipefail

          bucket="${{ vars.S3_SITE_BUCKET }}"
          if [[ -z "$bucket" ]]; then
            echo "S3_SITE_BUCKET is empty. Check GitHub Environment variables for environment '${{ needs.meta.outputs.deploy_env }}'."
            exit 1
          fi

          web_dir="$(find dist -maxdepth 3 -type d -name browser | head -n 1 || true)"
          if [[ -z "$web_dir" ]]; then
            echo "Cannot find dist/**/browser. Listing dist:"
            find dist -maxdepth 4 -type d
            exit 1
          fi

          echo "Sync $web_dir -> s3://$bucket/"
          aws s3 sync "$web_dir/" "s3://$bucket/" --delete
